name: CI
on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
env:
  CARGO_TERM_COLOR: always
  CARGO_INCREMENTAL: '0'
  CARGO_PROFILE_DEV_DEBUG: '0'
  CARGO_PROFILE_TEST_DEBUG: '0'
  RUSTFLAGS: --deny warnings
  RUSTDOCFLAGS: --deny warnings
jobs:
  format:
    name: Format
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@v7
      - name: Select repository Rust toolchain
        run: rustup show
      - name: Check Rust formatting
        run: cargo fmt --all -- --check
  clippy:
    name: Clippy
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Lint workspace
        run: cargo clippy --locked --workspace --all-targets --all-features -- --deny warnings
  test:
    name: Tests
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Install cargo-nextest
        uses: taiki-e/install-action@cargo-nextest
      - name: Run workspace tests
        run: cargo nextest run --locked --workspace --all-features --all-targets
      - name: Run documentation tests
        run: cargo test --locked --workspace --all-features --doc
      - name: Check browser build
        run: cargo check --locked -p web --target wasm32-unknown-unknown --no-default-features --features hydrate
  docs:
    name: Docs
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v7
      - name: Select repository Rust toolchain
        run: rustup show
      - uses: Swatinem/rust-cache@v2
      - name: Check documentation
        run: cargo doc --locked --workspace --all-features --document-private-items --no-deps
